  在一个温暖的下午，阳光从窗户斜斜地射进来，像融化的金色蜂蜜一样，均匀地洒满整个房间。空气里飘着一股淡淡的、甜甜的阳光清香味……像是刚晒过的棉被，又像是谁把柠檬和栀子花一起揉碎了洒在光里。
  <br/>
  小床上，三一安安静静地瘫着。
  <br/>
  皮肤白皙得像最精致的等身手办，柔和的身形上没有一点肌肉的痕迹，仿佛连呼吸都舍不得惊动这层薄薄的光。
  <br/>
  你忍不住伸出手，轻轻摸了摸。
  <br/>
  头发丝细密顺滑，像融进指尖的丝绸……
  <br/>
  然后是手，凉凉的，指尖还有一点昨天没擦干净的草莓酱颜色……
  <br/>
  再往上，脸颊……软软的，却没有一点温度。
  <br/>
  哦。
  <br/>
  原来是死了呢。
